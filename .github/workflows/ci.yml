name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  suites:
    name: Integration and concurrency suites
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: wagering_owner
          POSTGRES_PASSWORD: wagering_owner
          POSTGRES_DB: wagering
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering_owner -d wagering"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      ministack:
        image: ministackorg/ministack:1.5.39
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Service containers take no command, so max_connections (200, as in
      # docker-compose.yml) is set through ALTER SYSTEM and a restart.
      - name: Raise max_connections
        run: |
          docker exec ${{ job.services.postgres.id }} \
            psql -U wagering_owner -d wagering -c 'ALTER SYSTEM SET max_connections = 200'
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U wagering_owner -d wagering; do sleep 1; done
      - name: Wait for MiniStack
        run: |
          for _ in $(seq 60); do
            curl -sf localhost:4566/_ministack/health && exit 0
            sleep 1
          done
          exit 1
      - run: bun scripts/setup.ts
      - run: bun run test:integration
      - run: bun run test:concurrency
